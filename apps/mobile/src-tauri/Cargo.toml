[package]
name = "timber-mobile"
version = "0.1.0"
description = "Timber Android Bookmark Viewer"
authors = ["Parikshit Roy"]
edition = "2021"

[lib]
name = "timber_mobile_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = [] }
tauri-plugin-opener = "2.7"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

