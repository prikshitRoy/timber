name: Release Android APK

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android-apk:
    name: Build Standalone Android APK (universal)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: "yarn"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Rust toolchain (aarch64-linux-android)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Cache Rust build artifacts
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/mobile/src-tauri -> target

      - name: Configure Android NDK environment
        run: |
          NDK_PATH="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          if [ -z "$NDK_PATH" ]; then
            echo "Android NDK not found on runner."
            exit 1
          fi
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          echo "Using NDK_HOME=$NDK_PATH"

      - name: Install workspace dependencies
        run: yarn install --frozen-lockfile

      - name: Run workspace tests and typecheck
        run: |
          yarn test
          yarn typecheck

      - name: Configure Android release signing (from secrets)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          ANDROID_DIR="apps/mobile/src-tauri/gen/android"
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_DIR/timber-release.keystore"
            cat <<EOF > "$ANDROID_DIR/keystore.properties"
          storePassword=$ANDROID_STORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=timber-release.keystore
          EOF
            echo "HAS_SIGNING=true" >> "$GITHUB_ENV"
            echo "Release signing configured."
          else
            echo "HAS_SIGNING=false" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set. Building unsigned release APK."
          fi

      - name: Ensure gradlew is executable on Linux
        run: chmod +x apps/mobile/src-tauri/gen/android/gradlew

      - name: Build Android release APK (arm64)
        run: yarn build:mobile:apk

      - name: Resolve generated APK path
        id: apk
        run: |
          APK_DIR="apps\mobile\src-tauri\gen\android\app\build\outputs\apk\universal\release"
          if [ -f "$APK_DIR/app-universal-release.apk" ]; then
            echo "path=$APK_DIR/app-universal-release.apk" >> "$GITHUB_OUTPUT"
            echo "name=timber-android-arm64.apk" >> "$GITHUB_OUTPUT"
          elif [ -f "$APK_DIR/app-arm64-release-unsigned.apk" ]; then
            echo "path=$APK_DIR/app-arm64-release-unsigned.apk" >> "$GITHUB_OUTPUT"
            echo "name=timber-android-arm64-unsigned.apk" >> "$GITHUB_OUTPUT"
          else
            echo "No APK found in $APK_DIR"
            ls -la "$APK_DIR"
            exit 1
          fi

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14

      - name: Publish GitHub Release on version tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
